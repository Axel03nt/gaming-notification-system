[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaming-notification-system"
version = "0.1.0"
description = "Event-driven notification system for a gaming platform"
authors = [{ name = "Axel Tolentino", email = "axel0309nt@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "aiokafka~=0.12.0",
    "redis~=5.2",
    "fastapi~=0.115.0",
    "pydantic~=2.9",
    "uvicorn[standard]~=0.30.0",
    "prometheus-client~=0.21.0",
    "websockets~=14.1",
]

[project.optional-dependencies]
dev = [
    "invoke~=2.2",
    "pytest~=8.3",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=6.0",
    "httpx~=0.27.0",
    "fakeredis~=2.26",
    "ruff~=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notifications"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"